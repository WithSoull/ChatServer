syntax = "proto3";

package chat_v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

option go_package = "github.com/WithSoull/ChatServer/pkg/chat/v1;chat_v1";

// --------------------
// Service Definition
// --------------------
service ChatV1 {
  // --------------------
  // Chat Endpoints
  // --------------------
  rpc ConnectChat(ConnectChatRequest) returns (stream Message);
  rpc CreateChat(CreateChatRequest) returns (CreateChatResponse){
    option (google.api.http) = {
      post: "/chat/v1/chats"
      body: "*" 
    };
  };
  rpc DeleteChat(DeleteChatRequest) returns (google.protobuf.Empty){
    option (google.api.http) = {
      delete: "/chat/v1/chats/{chat_id}"
    };
  };
  rpc GetChat(GetChatRequest) returns (GetChatResponse){
    option (google.api.http) = {
      get: "/chat/v1/chats/{chat_id}"
    };
  };

  // --------------------
  // User Endpoints
  // --------------------
  rpc AddUser(AddUserRequest) returns (google.protobuf.Empty){
    option (google.api.http) = {
      post: "/chat/v1/chats/{chat_id}/users/{user_id}"
      body: "*" 
    };
  };
  rpc RemoveUser(RemoveUserRequest) returns (google.protobuf.Empty){
    option (google.api.http) = {
      delete: "/chat/v1/chats/{chat_id}/users/{user_id}"
    };
  };
  rpc UpdateUserRole(UpdateUserRoleRequest) returns (google.protobuf.Empty){
    option (google.api.http) = {
      patch: "/chat/v1/chats/{chat_id}/users/{user_id}"
      body: "*" 
    };
  };

  // --------------------
  // Message Endpoints
  // --------------------
  rpc SendMessage(SendMessageRequest) returns (google.protobuf.Empty){
    option (google.api.http) = {
      post: "/chat/v1/chats/{chat_id}/messages"
      body: "*" 
    };
  };
  rpc DeleteMessage(DeleteMessageRequest) returns (google.protobuf.Empty){
    option (google.api.http) = {
      delete: "/chat/v1/messages/{message_id}"
    };
  };
  rpc EditMessage(EditMessageRequest) returns (google.protobuf.Empty){
    option (google.api.http) = {
      patch: "/chat/v1/messages/{message_id}"
      body: "*" 
    };
  };
  rpc PinMessage(PinMessageRequest) returns (google.protobuf.Empty){
    option (google.api.http) = {
      patch: "/chat/v1/messages/{message_id}/pin"
      body: "*" 
    };
  };
}

// --------------------
// Enums
// --------------------
enum Role {
  ROLE_USER = 0;
  ROLE_ADMIN = 1;
  ROLE_OWNER = 2;
}

// --------------------
// Entities
// --------------------
message ChatInfo {
  string name = 1;
  string description = 2;
  repeated int64 user_ids = 3;
}

message Chat {
  int64 chat_id = 1;
  int64 owner_id = 2;
  ChatInfo chat_info = 3;
}

message Message {
  int64 message_id = 1;
  int64 sender_id = 2;
  int64 chat_id = 3;
  string text = 4;
  bool is_pinned = 5;
  google.protobuf.Timestamp send_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// --------------------
// Chat RPC Messages
// --------------------
message ConnectChatRequest {
  int64 chat_id = 1;
}

message CreateChatRequest {
  ChatInfo chat_info = 1;
}

message CreateChatResponse {
  int64 chat_id = 1;
}

message DeleteChatRequest {
  int64 chat_id = 1;
}

message GetChatRequest {
  int64 chat_id = 1;
}

message GetChatResponse {
  Chat chat = 1;
  repeated Message messages = 2;
}

// --------------------
// User Management RPC Messages
// --------------------
message AddUserRequest {
  int64 chat_id = 1;
  int64 user_id = 2;
  Role role = 3;
}

message RemoveUserRequest {
  int64 chat_id = 1;
  int64 user_id = 2;
}

message UpdateUserRoleRequest {
  int64 chat_id = 1;
  int64 user_id = 2;
  Role role = 3;
}

// --------------------
// Message RPC Messages
// --------------------
message SendMessageRequest {
  int64 chat_id = 1;
  string text = 2;
}

message DeleteMessageRequest {
  int64 message_id = 1;
}

message EditMessageRequest {
  int64 message_id = 1;
  string new_text = 2;
}

message PinMessageRequest {
  int64 message_id = 1;
  bool new_is_pinned = 2;
}
